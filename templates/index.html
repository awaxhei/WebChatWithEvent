<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尤夏 - AI 角色扮演</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/image/icon-192.png">
    <link rel="icon" type="image/png" href="/static/image/icon-192.png">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- 登录遮罩 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <svg class="login-lock" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="text" id="loginUsername" placeholder="用户名" autocomplete="off">
            <input type="password" id="loginPassword" placeholder="密码" autocomplete="off">
            <label class="remember-label">
                <input type="checkbox" id="rememberPwd">
                <span>记住</span>
            </label>
            <button id="btnLogin">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                </svg>
            </button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- API Key 设置面板 -->
    <div class="login-overlay hidden" id="settingsOverlay">
        <div class="login-box settings-box">
            <svg class="login-lock" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <div class="settings-title">DeepSeek API Key</div>
            <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off" spellcheck="false">
            <div class="settings-hint" id="apiKeyHint">留空则使用服务器 config.py 中配置的 Key</div>
            <div class="settings-actions">
                <button class="btn-settings primary" id="btnApiKeySave">保存</button>
                <button class="btn-settings" id="btnApiKeyClear">清除</button>
                <button class="btn-settings" id="btnSettingsClose">关闭</button>
            </div>
        </div>
    </div>

    <!-- 移动端顶部导航 -->
    <header class="mobile-header" id="mobileHeader">
        <button class="nav-btn" data-panel="history" title="历史">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
        </button>
    </header>

    <!-- 主体布局 -->
    <div class="app-container" id="appContainer">

        <!-- 左侧：历史记录面板 -->
        <aside class="sidebar history-panel" id="historyPanel">
                <div class="panel-header">
                <button class="btn-icon" id="btnNewChat" title="新对话">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
                <div class="panel-header-actions">
                    <button class="btn-icon" id="btnSettings" title="API Key 设置">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                    <button class="btn-icon btn-logout" id="btnLogout" title="退出登录">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                    </button>
                </div>
            </div>
            <ul class="history-list" id="historyList"></ul>
        </aside>

        <!-- 中间：聊天主区域 -->
        <main class="chat-main">
            <div class="char-title" id="charTitle">
                <span class="char-name">尤夏</span>
                <button class="location-tag" id="locationTag" title="点击切换场景">公寓客厅</button>
                <ul class="location-picker" id="locationPicker"></ul>
            </div>
            <div class="scene-card" id="sceneCard" style="display:none;">
                <div class="scene-desc" id="sceneDesc"></div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <svg class="welcome-icon" viewBox="0 0 64 64" width="56" height="56" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round">
                        <path d="M32 8C19 8 8 17 8 28c0 10 8 17 16 19v9l10-8c12 0 22-9 22-20S45 8 32 8z"/>
                        <circle cx="22" cy="28" r="2.5" fill="#6366f1"/><circle cx="42" cy="28" r="2.5" fill="#6366f1"/>
                    </svg>
                </div>
            </div>
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <button class="btn-push-mode" id="btnPushMode" title="故事推进模式">
                        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                            <path d="M10 3v3m0 8v3M3 10h3m8 0h3"/><circle cx="10" cy="10" r="3"/><path d="M10 7v6M7 10h6"/>
                        </svg>
                    </button>
                    <textarea id="messageInput" placeholder="输入消息..." rows="1" autofocus></textarea>
                    <button class="btn-send" id="btnSend" title="发送">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- 右侧：事件面板 -->
        <aside class="event-panel" id="eventPanel">
            <div class="event-panel-header">
                <span class="event-panel-title">故事进展</span>
                <button class="btn-icon btn-event-close" id="btnEventClose" title="关闭">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="event-story-time" id="eventStoryTime">
                <span class="time-icon"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><polyline points="8 5 8 8 10.5 10.5"/></svg></span>
                <span class="time-text">第一天早晨</span>
            </div>
            <div class="event-summary" id="eventSummary"></div>
            <div class="event-list" id="eventList">
                <div class="event-empty">暂无事件记录，开始对话吧～</div>
            </div>
            <div class="event-push-hint" id="eventPushHint" style="display:none;">
                <div class="push-hint-bar">
                    <span class="push-icon"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="1.5" fill="currentColor"/><path d="M8 3V1m0 14v-2M1 8h2m10 0h2M3.05 3.05l1.41 1.41m7.08 7.08l1.41 1.41M3.05 12.95l1.41-1.41m7.08-7.08l1.41-1.41"/></svg></span>
                    <span class="push-text" id="pushHintText"></span>
                </div>
            </div>
        </aside>

    </div>

    <!-- 手机（左下角） -->
    <button class="phone-fab" id="btnPhone" title="手机">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="6" y="2" width="12" height="20" rx="2.5"/>
            <line x1="10" y1="5" x2="14" y2="5"/>
            <circle cx="12" cy="18.5" r="1"/>
        </svg>
        <span class="phone-badge" id="phoneBadge" style="display:none;">0</span>
    </button>

    <!-- 手机面板 -->
    <div class="phone-overlay" id="phoneOverlay">
        <div class="phone-shell">
            <div class="phone-header">
                <span class="phone-title">手机 · 与尤夏</span>
                <button class="btn-icon" id="phoneClose" title="关闭">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="phone-list" id="phoneList"></div>
            <div class="phone-input-row">
                <input type="text" id="phoneInput" placeholder="发消息..." autocomplete="off">
                <button class="phone-send" id="phoneSend" title="发送">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 移动端遮罩 -->
    <div class="overlay" id="overlay"></div>

    <script src="/static/js/api_key.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }
    </script>
</body>
</html>
